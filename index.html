
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI - Your AI Assistant</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#090b14;
  color:#fff;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.sidebar{
  width:250px;
  background:#101321;
  border-right:1px solid #25283a;
  padding:22px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:35px;
}

.logo span{
  color:#8d7bff;
}

.new-chat{
  padding:14px;
  border:1px solid #383653;
  background:#1b1b32;
  color:white;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
}

.new-chat:hover{
  background:#292547;
}

.sidebar-info{
  margin-top:auto;
  font-size:12px;
  color:#777d91;
  line-height:1.8;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:68px;
  border-bottom:1px solid #25283a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.topbar small{
  color:#8d7bff;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:25px 15px;
}

.welcome{
  max-width:750px;
  margin:10vh auto;
  text-align:center;
}

.orb{
  width:70px;
  height:70px;
  border-radius:23px;
  background:linear-gradient(135deg,#806cff,#20c6c8);
  display:grid;
  place-items:center;
  font-size:32px;
  margin:0 auto 22px;
  box-shadow:0 0 45px #806cff55;
}

.welcome h1{
  font-size:37px;
  margin-bottom:12px;
}

.welcome p{
  color:#999db2;
  font-size:15px;
}

.suggestions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:30px;
}

.suggestion{
  padding:18px;
  background:#141827;
  border:1px solid #292d42;
  color:#eee;
  border-radius:13px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.suggestion:hover{
  border-color:#8978ff;
  transform:translateY(-2px);
}

.messages{
  max-width:850px;
  margin:auto;
}

.msg{
  display:flex;
  gap:12px;
  margin:22px 0;
  align-items:flex-start;
}

.avatar{
  height:36px;
  width:36px;
  min-width:36px;
  border-radius:11px;
  background:#30264f;
  display:grid;
  place-items:center;
  font-size:13px;
}

.msg.user .avatar{
  background:#24434b;
}

.content{
  flex:1;
  min-width:0;
}

.bubble{
  background:#151a29;
  border:1px solid #292e42;
  padding:14px 17px;
  border-radius:4px 15px 15px 15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.8;
  font-size:14px;
}

.msg.user .bubble{
  background:#202039;
}

.copy{
  background:none;
  border:0;
  color:#a79bff;
  margin-top:9px;
  cursor:pointer;
  font-size:12px;
}

.bottom{
  padding:15px 18px 22px;
}

.composer{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:10px;
  background:#151a29;
  border:1px solid #383b52;
  padding:9px;
  border-radius:16px;
}

textarea{
  flex:1;
  resize:none;
  max-height:130px;
  min-height:42px;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-size:15px;
  padding:12px;
}

.send{
  width:46px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#8976ff,#5748ca);
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
  cursor:wait;
}

.hint{
  text-align:center;
  color:#73788d;
  font-size:11px;
  margin-top:10px;
}

@media(max-width:650px){
  .sidebar{
    width:65px;
    padding:13px 7px;
  }

  .logo{
    font-size:0;
    text-align:center;
  }

  .logo:first-letter{
    font-size:25px;
  }

  .new-chat{
    font-size:0;
    padding:12px 3px;
  }

  .new-chat:after{
    content:"+";
    font-size:20px;
  }

  .sidebar-info{
    display:none;
  }

  .topbar{
    padding:0 13px;
  }

  .chat-area{
    padding:15px 10px;
  }

  .welcome{
    margin-top:7vh;
  }

  .welcome h1{
    font-size:27px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .bottom{
    padding:10px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">

  <div class="logo">NOVA<span> AI</span></div>

  <button class="new-chat" onclick="newChat()">
    ＋ New Chat
  </button>

  <div class="sidebar-info">
    NOVA AI Assistant<br>
    Powered by Groq API<br>
    Your intelligent AI companion.
  </div>

</aside>

<main class="main">

  <header class="topbar">
    <strong>AI Assistant</strong>
    <small>● GROQ POWERED</small>
  </header>

  <section class="chat-area" id="chatArea">

    <div class="welcome" id="welcome">

      <div class="orb">✦</div>

      <h1>Hey, I'm NOVA AI</h1>

      <p>
        Your intelligent assistant.
        Ask me anything.
      </p>

      <div class="suggestions">

        <button class="suggestion"
        onclick="ask('Explain Artificial Intelligence in simple words')">
          ✧ Explain Artificial Intelligence
        </button>

        <button class="suggestion"
        onclick="ask('Give me creative website ideas')">
          ⌘ Website Project Ideas
        </button>

        <button class="suggestion"
        onclick="ask('Teach me JavaScript from basics')">
          ⚡ Learn JavaScript
        </button>

        <button class="suggestion"
        onclick="ask('Tell me an interesting science fact')">
          ✦ Science Facts
        </button>

      </div>
    </div>

    <div class="messages" id="messages"></div>

  </section>

  <footer class="bottom">

    <div class="composer">

      <textarea
        id="input"
        rows="1"
        placeholder="Message NOVA AI..."
      ></textarea>

      <button
        class="send"
        id="send"
        onclick="sendMessage()"
      >➤</button>

    </div>

    <div class="hint">
      NOVA AI can make mistakes. Verify important information.
    </div>

  </footer>

</main>

<script>

// ===================================
// NOVA AI CONFIGURATION
// ===================================

// अपनी Groq API Key यहाँ डालें
const GROQ_API_KEY = "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";

// AI MODEL
const MODEL = "openai/gpt-oss-120b";

// ===================================

const input = document.getElementById("input");
const messagesBox = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("send");

let history = [];

function addMessage(role,text){

  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "msg " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "✦";

  const content = document.createElement("div");
  content.className = "content";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  content.appendChild(bubble);

  if(role === "assistant"){

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "Copy response";

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copy.textContent = "Copied!";
      } catch {
        copy.textContent = "Copy unavailable";
      }
    };

    content.appendChild(copy);
  }

  row.append(avatar,content);
  messagesBox.appendChild(row);

  const chatArea = document.getElementById("chatArea");
  chatArea.scrollTop = chatArea.scrollHeight;

  return bubble;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text || sendBtn.disabled) return;

  if(GROQ_API_KEY === "YOUR_GROQ_API_KEY"){
    alert("Please add your Groq API Key in the code!");
    return;
  }

  input.value = "";

  addMessage("user",text);

  history.push({
    role:"user",
    content:text
  });

  sendBtn.disabled = true;
  sendBtn.textContent = "...";

  const loading = addMessage(
    "assistant",
    "NOVA is thinking..."
  );

  try{

    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + GROQ_API_KEY
        },

        body:JSON.stringify({

          model:MODEL,

          messages:[
            {
              role:"system",
              content:
              "You are NOVA AI, a friendly, helpful and intelligent AI assistant. Answer clearly, accurately and naturally. Reply in the user's language. Explain difficult topics in simple steps."
            },
            ...history
          ],

          temperature:0.7,
          max_completion_tokens:2048

        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error?.message || "Groq API request failed"
      );
    }

    const reply =
      data.choices?.[0]?.message?.content ||
      "No response received.";

    loading.textContent = reply;

    history.push({
      role:"assistant",
      content:reply
    });

  }catch(error){

    loading.textContent = "Error: " + error.message;

    history.pop();

  }finally{

    sendBtn.disabled = false;
    sendBtn.textContent = "➤";
    input.focus();

  }
}

function ask(text){
  input.value = text;
  sendMessage();
}

function newChat(){

  history = [];

  messagesBox.innerHTML = "";

  welcome.style.display = "block";

  input.value = "";
  input.focus();

}

input.addEventListener("keydown",(e)=>{

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>
